!Version ArubaOS-CX FL.10.10.1010
!export-password: default
hostname acx-access-01
clock timezone europe/london
!
user admin group administrators password ciphertext AQBapREDACTED
user auditor group operators password ciphertext AQBapREDACTED
!
aaa authentication login default group tacacs local
aaa authentication limit-login-attempts 5 lockout-time 300
aaa group server tacacs tacacs-group
    server 10.10.5.20
!
ssh server vrf mgmt
ssh ciphers aes256-ctr aes192-ctr
ssh macs hmac-sha2-256 hmac-sha2-512
https-server vrf mgmt
cli-session timeout 10
!
ntp server 10.10.5.10 prefer
ntp server 10.10.5.11
ntp enable
ntp authentication enable
!
logging 10.10.5.40 vrf mgmt severity info
!
snmp-server community REDACTED
snmpv3 user nms auth sha REDACTED priv aes REDACTED
!
banner motd
Authorised access only. Activity is monitored.
!
vlan 1
vlan 10
    name USERS
!
interface 1/1/1
    no shutdown
    description uplink-to-core
    ip address 10.10.0.2/30
!
interface mgmt
    no shutdown
    ip static 10.10.5.2/24
!
