#config-version=FGT60F-7.0.12-FW-build0523-230független:opmode=0:vdom=0
#conf_file_ver=1
#buildno=0523
#global_vdom=1
config system global
    set admintimeout 5
    set admin-lockout-duration 60
    set admin-lockout-threshold 3
    set admin-https-redirect enable
    set admin-server-cert "Fortinet_Factory"
    set admin-ssh-port 22
    set admin-https-ssl-versions "tlsv1-2 tlsv1-3"
    set alias "FGT60F-EDGE"
    set hostname "fgt-edge-01"
    set pre-login-banner enable
    set post-login-banner enable
    set ssl-static-key-ciphers disable
    set strong-crypto enable
    set revision-backup-on-logout enable
    set timezone 12
    set two-factor-ha-direct disable
end
config system console
    set output standard
end
config system password-policy
    set status enable
    set minimum-length 8
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-number 1
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set trusthost1 10.10.0.0 255.255.255.0
    next
    edit "auditor"
        set accprofile "prof_admin"
        set vdom "root"
    next
end
config user radius
    edit "corp-radius"
        set server "10.10.5.20"
        set auth-type auto
    next
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.0
        set allowaccess ping https
        set description "WAN uplink"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh snmp
        set description "LAN core"
        set role lan
    next
    edit "port3"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping
        set description "DMZ"
        set role dmz
    next
end
config system zone
    edit "trusted"
        set interface "port2"
    next
    edit "dmz"
        set interface "port3"
    next
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.10.5.10"
        next
        edit 2
            set server "10.10.5.11"
        next
    end
end
config system snmp sysinfo
    set status enable
end
config system snmp community
    edit 1
        set name "monitoring"
        set hosts "10.10.5.30"
    next
end
config system snmp user
    edit "nms-v3"
        set security-level auth-priv
        set auth-proto sha256
        set priv-proto aes256
    next
end
config log syslogd setting
    set status enable
    set server "10.10.5.40"
    set severity information
    set source-ip "10.10.0.1"
end
config log setting
    set local-in-deny-unicast enable
end
config ips global
    set database extended
end
config firewall address
    edit "lan-subnet"
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "dmz-subnet"
        set subnet 10.20.0.0 255.255.255.0
    next
    edit "web servers"
        set subnet 10.20.0.16 255.255.255.240
    next
    edit "db servers"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "partner-range"
        set type iprange
        set start-ip 198.51.100.10
        set end-ip 198.51.100.20
    next
    edit "updates.example.net"
        set type fqdn
        set fqdn "updates.example.net"
    next
end
config firewall addrgrp
    edit "internal-servers"
        set member "web servers" "db servers"
    next
end
config firewall service custom
    edit "TCP-8443"
        set tcp-portrange 8443
    next
    edit "app-ports"
        set tcp-portrange 8000-8100 9090
    next
    edit "sql-with-source"
        set tcp-portrange 1433:1024-65535
    next
    edit "GRE"
        set protocol IP
        set protocol-number 47
    next
end
config firewall service group
    edit "web-services"
        set member "HTTP" "HTTPS" "TCP-8443"
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "lan-subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set logtraffic all
        set comments "General outbound access"
        set nat enable
        set policyid 1
    next
    edit 2
        set name "dmz-to-lan-deny"
        set srcintf "port3"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Block DMZ pivot to LAN"
        set policyid 2
    next
    edit 3
        set name "partners-to-web"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "partner-range"
        set dstaddr "web servers"
        set action accept
        set schedule "always"
        set service "web-services"
        set logtraffic all
        set policyid 3
    next
    edit 4
        set name "night-batch-to-db"
        set srcintf "port2"
        set dstintf "port2"
        set srcaddr "lan-subnet"
        set dstaddr "db servers"
        set action accept
        set schedule "after-hours"
        set service "sql-with-source"
        set logtraffic all
        set policyid 4
    next
    edit 5
        set name "everything-except-guests"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "lan-subnet"
        set srcaddr-negate enable
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set policyid 5
    next
    edit 6
        set name "retired-vendor-access"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "partner-range"
        set dstaddr "dmz-subnet"
        set action accept
        set status disable
        set schedule "always"
        set service "SSH"
        set policyid 6
    next
end
