! device: sw-core-01 (DCS-7050SX3-48YC8, EOS-4.29.2F)
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$REDACTEDHASH
username auditor privilege 5 role network-operator secret sha512 $6$REDACTEDHASH
!
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting commands all default start-stop group tacacs+
!
service routing protocols model multi-agent
!
hostname sw-core-01
!
clock timezone Europe/London
ntp server vrf mgmt 10.10.5.10 prefer
ntp server vrf mgmt 10.10.5.11
!
snmp-server community REDACTED ro SNMP-ACL
snmp-server user nms nmsgroup v3 auth sha REDACTED priv aes REDACTED
!
logging host 10.10.5.40
logging trap informational
logging source-interface Management1
!
banner login
Authorised access only. Activity is monitored.
!
management ssh
   idle-timeout 10
   cipher aes256-ctr aes192-ctr
   key-exchange ecdh-sha2-nistp256 diffie-hellman-group14-sha1
   mac hmac-sha2-256 hmac-sha2-512
   no shutdown
!
management telnet
   shutdown
!
management api http-commands
   no protocol http
   protocol https
   no shutdown
!
ip access-list standard SNMP-ACL
   10 permit 10.10.5.0/24
!
interface Ethernet1
   description uplink-to-border
   no switchport
   ip address 10.10.0.1/30
!
interface Management1
   ip address 10.10.5.1/24
!
end
