system {
    host-name srx-fw-01;
    root-authentication {
        encrypted-password "$6$abcd1234"; ## SECRET-DATA
    }
    login {
        class ops {
            idle-timeout 45;
            permissions all;
        }
        message "Unauthorized access prohibited";
        password {
            minimum-length 8;
        }
        user operator {
            uid 2001;
            class read-only;
        }
    }
    services {
        ssh {
            protocol-version v2;
            connection-limit 10;
            root-login deny;
        }
        telnet;
        web-management {
            http {
                interface ge-0/0/0.0;
            }
        }
    }
    syslog {
        host 10.20.0.50 {
            any notice;
        }
    }
    ntp {
        server 10.20.0.9;
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 198.51.100.2/30;
            }
        }
    }
}
security {
    address-book {
        global {
            address HR_SUBNET_A 10.20.0.0/16;
            address HR_SUBNET_B 10.30.0.0/16;
            address WEB01 10.10.20.50/32;
            address DC01 10.10.10.10/32;
            address-set HR_NET {
                address HR_SUBNET_A;
                address HR_SUBNET_B;
            }
            address-set ALL_CORP {
                address-set HR_NET;
                address DC01;
            }
            address-set BROKEN_SET {
                address HR_SUBNET_A;
                address DECOMMISSIONED_SITE;
            }
            address-set LOOP_A {
                address-set LOOP_B;
            }
            address-set LOOP_B {
                address-set LOOP_A;
            }
        }
    }
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone dmz {
            interfaces {
                ge-0/0/1.0;
            }
        }
    }
    policies {
        from-zone untrust to-zone dmz {
            policy allow-web {
                match {
                    source-address any;
                    destination-address WEB01;
                    application HTTPS_SVC;
                }
                then {
                    permit;
                }
            }
            policy allow-rdp-vendor {
                match {
                    source-address any;
                    destination-address DC01;
                    application RDP_SVC;
                }
                then {
                    permit;
                }
            }
            policy allow-db-broken {
                match {
                    source-address BROKEN_SET;
                    destination-address DC01;
                    application MYSQL_SVC;
                }
                then {
                    permit;
                }
            }
        }
    }
}
applications {
    application HTTPS_SVC {
        protocol tcp;
        destination-port 443;
    }
    application RDP_SVC {
        protocol tcp;
        destination-port 3389;
    }
    application MYSQL_SVC {
        protocol tcp;
        destination-port 3306;
    }
}
