## Junos SRX security policy export -- includes address book, groups and policies
security {
    address-book {
        global {
            address HR_SUBNET_A 10.20.0.0/16;
            address HR_SUBNET_B 10.30.0.0/16;
            address WEB01 10.10.20.50/32;
            address DC01 10.10.10.10/32;
            address-set HR_NET {
                address HR_SUBNET_A;
                address HR_SUBNET_B;
            }
            address-set ALL_CORP {
                address-set HR_NET;
                address DC01;
            }
            address-set BROKEN_SET {
                address HR_SUBNET_A;
                address DECOMMISSIONED_SITE;
            }
            address-set LOOP_A {
                address-set LOOP_B;
            }
            address-set LOOP_B {
                address-set LOOP_A;
            }
        }
    }
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone dmz {
            interfaces {
                ge-0/0/1.0;
            }
        }
    }
    policies {
        from-zone untrust to-zone dmz {
            policy allow-web {
                match {
                    source-address any;
                    destination-address WEB01;
                    application HTTPS_SVC;
                }
                then {
                    permit;
                }
            }
            policy allow-rdp-vendor {
                match {
                    source-address any;
                    destination-address DC01;
                    application RDP_SVC;
                }
                then {
                    permit;
                }
            }
            policy allow-db-broken {
                match {
                    source-address BROKEN_SET;
                    destination-address DC01;
                    application MYSQL_SVC;
                }
                then {
                    permit;
                }
            }
        }
    }
}
applications {
    application HTTPS_SVC {
        protocol tcp;
        destination-port 443;
    }
    application RDP_SVC {
        protocol tcp;
        destination-port 3389;
    }
    application MYSQL_SVC {
        protocol tcp;
        destination-port 3306;
    }
}
