!
! Test fixture assembled ENTIRELY from commands published in the
! "Cisco Guide to Harden Cisco IOS Devices"
! https://www.cisco.com/c/en/us/support/docs/ip/access-lists/13608-21.html
! retrieved 2026-08-28.
!
! Purpose: break the circular validation. Every other sample in this repo was
! written by us, so the packs were being tested against configs authored to
! match them. Every line below is a command Cisco documents, so passing this
! fixture means the pack reads the vendor's own baseline -- not our fiction.
!
version 17.9
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps log datetime msec localtime show-timezone
no service password-recovery
no service tcp-small-servers
no service udp-small-servers
!
hostname hardened-per-guide
!
clock timezone PST -8
!
aaa new-model
aaa authentication login default group tacacs+ enable
aaa authorization exec default group tacacs none
aaa authorization commands 0 default group tacacs none
aaa authorization commands 1 default group tacacs none
aaa authorization commands 15 default group tacacs none
aaa accounting exec default start-stop group tacacs
aaa accounting commands 0 default start-stop group tacacs
aaa accounting commands 15 default start-stop group tacacs
aaa local authentication attempts max-fail 3
!
enable secret 5 $1$abcd$EXAMPLEHASHVALUE01
username ssh-user privilege 15 algorithm-type scrypt secret 9 $9$EXAMPLE
!
security passwords min-length 15
!
no ip finger
no ip bootp server
no ip source-route
no ip redirects
no ip unreachables
no ip proxy-arp
no ip http server
ip http secure-server
!
ip domain-name example.com
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh stricthostkeycheck
ip ssh source-interface Loopback 0
ip ssh pubkey-chain
ip scp server enable
!
interface Loopback 0
 ip address 192.168.100.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description WAN
 ip address 192.168.1.1 255.255.255.0
 no ip redirects
 no shutdown
!
logging buffered 16384 6
logging trap 6
logging host 192.168.100.50
logging source-interface Loopback 0
logging persistent url disk0:/syslog size 134217728 filesize 16384
no logging console
no logging monitor
!
ntp server 192.168.100.9
ntp authenticate
!
snmp-server view VIEW-SYSTEM-ONLY system include
snmp-server community READONLY RO 98
snmp-server group AUTHGROUP v3 auth
snmp-server group PRIVGROUP v3 priv
snmp-server user snmpv3user PRIVGROUP v3 auth md5 authpassword priv 3des
!
banner login ^C
UNAUTHORIZED ACCESS TO THIS DEVICE IS PROHIBITED
^C
!
access-list 98 permit 192.168.100.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 transport output none
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 exec-timeout 5 0
 access-class 98 in
 transport input ssh
 transport output none
!
end
