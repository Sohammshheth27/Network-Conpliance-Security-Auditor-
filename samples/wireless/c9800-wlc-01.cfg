! FIXTURE -- constructed, not exported from a real controller.
! Every wlan command below is taken from Cisco's published Catalyst 9800
! configuration guides (WLANs, WLAN Security, WPA3). It exists to exercise the
! wireless adapter; findings on it demonstrate the checks, not a real network.
!
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
hostname WLC-FIXTURE-01
!
aaa new-model
aaa authentication login default local
!
username wlcadmin privilege 15 secret 9 $9$fixtureonlynotarealhash
!
ip ssh version 2
!
wlan CORP 1 CORP
 no shutdown
!
wlan GUEST 2 Guest-WiFi
 no security wpa
 no security wpa wpa2
 no security wpa akm dot1x
 security web-auth
 no shutdown
!
wlan IOT 3 IoT-Devices
 security wpa wpa1
 security wpa wpa1 ciphers tkip
 no security wpa akm dot1x
 security wpa akm psk
 security wpa psk set-key ascii 0 fixture-key-not-real
 no shutdown
!
wlan SECURE 4 Secure-WPA3
 no security wpa wpa2
 security wpa wpa3
 no security wpa akm dot1x
 security wpa akm sae
 security pmf mandatory
 peer-blocking drop
 no shutdown
!
wlan LEGACY 5 Old-Lab
 no security wpa
 shutdown
!
line vty 0 4
 transport input ssh
!
end
