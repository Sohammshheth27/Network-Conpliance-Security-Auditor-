id: NCSA-EXT-034
title: DHCP snooping should be enabled on access switches
field: l2.dhcp_snooping
operator: equals
expected: true
severity: medium
tier: extended
rationale: >-
  Without snooping, any host can offer DHCP and become the default gateway.
frameworks:
