id: NCSA-PLT-002
title: Stored credentials and configuration parameters must be encrypted
field: platform.stored_credentials_encrypted
operator: equals
expected: true
severity: high
tier: extended
rationale: >-
  Credentials held in the saved configuration are readable by anyone who obtains a backup.
frameworks:
  nist_800_53: ['IA-5(1)', 'SC-28']
  iso_27001_2022: ['A.5.17', 'A.8.24']
