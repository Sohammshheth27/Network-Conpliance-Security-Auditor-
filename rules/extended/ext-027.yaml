id: NCSA-EXT-027
title: At least two time sources should be configured
field: time.servers
operator: min_count
expected: 2
severity: low
tier: extended
rationale: >-
  A single time source is a single point of failure for every timestamp.
frameworks:
  nist_800_53: ["AU-8"]
  iso_27001_2022: ["A.8.17"]
  stig_by_platform:
    cisco_iosxe_router: [V-215838]
    cisco_iosxe_switch: [V-220549]
    paloalto_panos: [V-228665]
    cisco_asa: [V-239924]
  # STIG/CIS ids intentionally omitted: they are per-platform and
  # belong in the vendor pack (plan 6.1). An invented id is worse
  # than none -- see the v1.4 6.4 caveat.

remediation:
  panos:
    commands:
    - set deviceconfig system ntp-servers primary-ntp-server ntp-server-address <NTP-1>
    - set deviceconfig system ntp-servers secondary-ntp-server ntp-server-address <NTP-2>
    - commit
    phase: 20
    verify: show deviceconfig system ntp-servers
