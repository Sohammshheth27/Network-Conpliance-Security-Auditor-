id: NCSA-EXT-005
title: RSA host key must be at least 2048 bits
field: crypto.rsa_modulus
operator: gte
expected: 2048
severity: high
tier: extended
rationale: >-
  Keys below 2048 bits are no longer considered computationally infeasible to break.
frameworks:
  nist_800_53: ["SC-13"]
  iso_27001_2022: ["A.8.24", "A.8.26"]
  # STIG/CIS ids intentionally omitted: they are per-platform and
  # belong in the vendor pack (plan 6.1). An invented id is worse
  # than none -- see the v1.4 6.4 caveat.
