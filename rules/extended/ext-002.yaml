id: NCSA-EXT-002
title: SSH strict host key checking should be enabled
field: management.ssh.strict_host_key
operator: equals
expected: true
severity: medium
tier: extended
rationale: >-
  Without host key verification an administrator cannot detect an interposed device on the management path.
