id: NCSA-EXT-010
title: Management lines must not permit outbound sessions
field: management.vty.transport_output
operator: contains_none
expected: ["telnet", "all", "lat", "rlogin"]
severity: medium
tier: extended
rationale: >-
  Outbound transports let a compromised device pivot from the control plane.
frameworks:
  nist_800_53: ["AC-4"]
  iso_27001_2022: ["A.5.14", "A.8.22", "A.8.23"]
  # STIG/CIS ids intentionally omitted: they are per-platform and
  # belong in the vendor pack (plan 6.1). An invented id is worse
  # than none -- see the v1.4 6.4 caveat.
