id: NCSA-EXT-007
title: HTTPS management must be enabled where web management is used
field: management.https.enabled
operator: equals
expected: true
severity: medium
tier: extended
rationale: >-
  If any web management is offered it must be the encrypted one.
frameworks:
  nist_800_53: ["SC-8.1"]
  iso_27001_2022: ["A.5.10", "A.5.14", "A.5.33", "A.8.20", "A.8.26"]
