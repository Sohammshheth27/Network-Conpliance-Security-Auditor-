id: NCSA-EXT-022
title: Remote syslog must be configured
field: logging.remote_syslog
operator: equals
expected: true
severity: high
tier: extended
rationale: >-
  Logs held only on the device are lost precisely when they matter.
frameworks:
  nist_800_53: ["AU-4", "AU-9"]
  iso_27001_2022: ["A.5.33", "A.8.15", "A.8.6"]
