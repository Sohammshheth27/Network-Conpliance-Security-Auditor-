id: NCSA-EXT-029
title: Configuration change archiving should be enabled
field: platform.config_archive
operator: equals
expected: true
severity: medium
tier: extended
rationale: >-
  Without archiving there is no record of what changed or the ability to roll back.
frameworks:
  nist_800_53: ["CM-3", "CM-6"]
  # Annex A controls only. Clauses 8.1 and 9.3.3 were cited here and have been
  # withdrawn: they are management-system requirements (operational planning,
  # management review results), and a device configuration cannot evidence
  # whether an organisation planned its operations or held a review. Citing
  # them from a config check is a category error an auditor would reject, and
  # it inflated this device's ISO requirement count with clauses no firewall
  # could ever satisfy.
  iso_27001_2022: ["A.8.32", "A.8.9"]
  # STIG/CIS ids intentionally omitted: they are per-platform and
  # belong in the vendor pack (plan 6.1). An invented id is worse
  # than none -- see the v1.4 6.4 caveat.

remediation:
  sonicwall_sonicos:
    commands:
    - configure
    - administration
    - auto-backup enable
    - commit
    phase: 10
    verify: show administration | grep backup
