id: NCSA-CAT-002
title: Firewall rules must not permit any source to any destination
field: firewall.rules.source
operator: contains_none
expected: ["0.0.0.0/0", "any"]
severity: critical
tier: category
rationale: >-
  An any-source rule defeats the purpose of the policy it sits in.
frameworks:
