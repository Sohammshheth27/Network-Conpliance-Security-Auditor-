id: NCSA-CLD-004
title: Default deny must be the implicit policy
field: firewall.default_action
operator: equals
expected: deny
severity: high
tier: category
# No applies_to: these controls read exposure.*/firewall.* which ANY vendor
# whose pack builds an object graph can populate. Platform applicability is
# already handled by supported_domains -- a platform with no 'exposure' domain
# gets NOT_APPLICABLE automatically. Pinning them to security_groups was a
# Day-2 artefact from when only AWS could produce these fields.
rationale: >-
  Anything not explicitly permitted must be denied.
frameworks:
  nist_800_53: [AC-4, SC-7(5)]
  iso_27001_2022: [A.5.14, A.8.16, A.8.20, A.8.22, A.8.23]
  stig_by_platform:
    juniper_srx: [V-214535]
  # AWS has no DISA STIG. CIS Foundations recommendation numbers
  # belong in the vendor pack, not here (plan 6.1).
