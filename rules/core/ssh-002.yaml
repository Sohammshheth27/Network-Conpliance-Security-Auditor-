id: NCSA-SSH-002
title: SSH must use protocol version 2
field: management.ssh.version
operator: equals
expected: 2
severity: high
tier: core
rationale: >-
  SSHv1 has known cryptographic weaknesses and cannot be considered confidential. Only version 2 is acceptable.
frameworks:
  nist_800_53: [AC-17(2), SC-8(1), IA-5]
  iso_27001_2022: [A.5.10, A.5.14, A.5.16, A.5.17, A.5.33, A.6.7, A.8.20, A.8.26]
  # STIG Vuln IDs are per-platform. Derived from the downloaded
  # XCCDF files, not recalled -- a control may map to several.
  stig_by_platform:
    cisco_iosxe_router: [V-215844]
    cisco_iosxe_switch: [V-220555]
    juniper_srx: [V-223209]
  # CIS recommendation numbers live in the vendor pack (plan 6.1).

remediation:
  cisco_iosxe_router:
    commands:
    - ip ssh version 2
    phase: 20
    verify: show ip ssh
  juniper_srx:
    commands:
    - set system services ssh protocol-version v2
    phase: 20
    verify: show configuration system services ssh
