id: NCSA-SSH-002
title: SSH must use protocol version 2
field: management.ssh.version
operator: equals
expected: 2
severity: high
tier: core
rationale: >-
  SSHv1 has known cryptographic weaknesses and cannot be considered confidential. Only version 2 is acceptable.
frameworks:
  nist_800_53: [AC-17.2, SC-8.1, IA-5]
  iso_27001_2022: [A.5.10, A.5.14, A.5.16, A.5.17, A.5.33, A.6.7, A.8.20, A.8.26]
  # STIG: Junos V-223209 was cited here and withdrawn -- it audits telnet,
  # FTP, SNMPv1/v2c and SSHv1 together, so no single control covers it.
  # CIS recommendation numbers live in crosswalks/cis.yaml.

remediation:
  cisco_iosxe_router:
    commands:
    - ip ssh version 2
    phase: 20
    verify: show ip ssh
  juniper_srx:
    commands:
    - set system services ssh protocol-version v2
    phase: 20
    verify: show configuration system services ssh
