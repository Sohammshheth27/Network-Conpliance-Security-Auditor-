id: NCSA-SNMP-001
title: SNMP v1/v2c must not be used
field: snmp.version
operator: not_in
expected: ["1", "v1", "2c", "v2c", "2"]
severity: high
tier: core
rationale: >-
  SNMP v1 and v2c authenticate with a cleartext community string and provide no confidentiality.
frameworks:
  nist_800_53: [AC-17(2), IA-3, SC-8]
  iso_27001_2022: [A.5.10, A.5.14, A.5.33, A.6.7, A.8.20, A.8.26]
  # STIG Vuln IDs are per-platform. Derived from the downloaded
  # XCCDF files, not recalled -- a control may map to several.
  stig_by_platform:
    cisco_iosxe_router: [V-215841, V-215842]
    cisco_iosxe_switch: [V-220552]
  # CIS recommendation numbers live in the vendor pack (plan 6.1).

remediation:
  cisco_iosxe_router:
    commands:
    - '! remove v1/v2c communities, then:'
    - snmp-server group NCSA-RO v3 priv
    - snmp-server user <user> NCSA-RO v3 auth sha <AUTHKEY> priv aes 128 <PRIVKEY>
    phase: 20
    verify: show snmp group
  juniper_srx:
    commands:
    - delete snmp community
    - set snmp v3 usm local-engine user <user> authentication-sha authentication-key <AUTHKEY>
    phase: 20
    verify: show configuration snmp

  sonicwall_sonicos:
    commands:
    - configure
    - administration snmp
    - version v3-only
    - commit
    phase: 40
    verify: show administration snmp
