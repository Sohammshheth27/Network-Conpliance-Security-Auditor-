id: NCSA-TIME-001
title: Idle session timeout must be 10 minutes or less
field: management.vty.exec_timeout
operator: lte
expected: 10
severity: high
tier: core
rationale: >-
  An unattended authenticated session is an unauthenticated path to administrative control.
frameworks:
  nist_800_53: [AC-12, SC-10]
  iso_27001_2022: [A.8.20]
  # STIG Vuln IDs are per-platform. Derived from the downloaded
  # XCCDF files, not recalled -- a control may map to several.
  stig_by_platform:
    juniper_srx: [V-223231]
    paloalto_panos: [V-228658]
  # CIS recommendation numbers live in the vendor pack (plan 6.1).

remediation:
  cisco_iosxe_router:
    commands:
    - line vty 0 15
    - ' exec-timeout 10 0'
    - ' exit'
    phase: 30
    verify: show running-config | section line vty
  # Junos sets the idle timeout per LOGIN CLASS; there is no system-wide
  # `system login idle-timeout`. Predefined classes cannot carry it, so each
  # custom class the administrators use needs the statement.
  juniper_srx:
    commands:
    - set system login class <class-name> idle-timeout 10
    phase: 30
    verify: show configuration system login | match idle-timeout

  sonicwall_sonicos:
    commands:
    - configure
    - administration
    - inactivity-timeout 10
    - commit
    phase: 20
    verify: show administration | grep inactivity
  cisco_asa:
    commands:
    - ssh timeout 2
    phase: 30
    verify: show running-config ssh
  fortios:
    commands:
    - config system global
    - set admintimeout 5
    - end
    phase: 30
    verify: show system global
  panos:
    commands:
    - set deviceconfig setting management idle-timeout 10
    - commit
    phase: 30
    verify: show deviceconfig setting management
