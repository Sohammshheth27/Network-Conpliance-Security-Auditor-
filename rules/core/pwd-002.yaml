id: NCSA-PWD-002
title: Password complexity must be enforced
field: authentication.complexity
operator: equals
expected: true
severity: medium
tier: core
rationale: >-
  Complexity requirements reduce the effectiveness of dictionary attacks.
frameworks:
  nist_800_53: [IA-5.1]
  iso_27001_2022: [A.5.16, A.5.17]
  # STIG Vuln IDs are per-platform. Derived from the downloaded
  # XCCDF files, not recalled -- a control may map to several.
  # CIS recommendation numbers live in the vendor pack (plan 6.1).

remediation:
  sonicwall_sonicos:
    commands:
    - configure
    - administration password-policy
    - complexity alpha-numeric-symbolic
    - commit
    phase: 20
    verify: show administration password-policy
  fortios:
    commands:
    - config system password-policy
    - set status enable
    - end
    phase: 30
    verify: show system password-policy
  panos:
    commands:
    - set mgt-config password-complexity enabled yes
    - commit
    phase: 30
    verify: show mgt-config password-complexity
