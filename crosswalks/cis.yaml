# Control -> CIS Benchmark recommendation numbers, per platform.
#
# IDENTIFIERS ONLY. CIS Benchmark text is copyrighted: titles and prose are
# never stored here. Each pairing was verified by a person against the
# recommendation's Audit section in a locally licensed copy of the benchmark,
# and tests/test_framework_selection.py checks every number exists in it.
#
# The mapping rule -- a control cites a recommendation only when:
#   1. the recommendation audits the SAME setting the control reads, and
#   2. the pass threshold is the SAME. Stricter or looser is a near-miss and
#      stays unmapped: "FAIL - CIS 2.1.1.1.4" on a 90-second SSH timeout would
#      be false, because CIS asks for 60 and we ask for 120.
#   A recommendation that audits two settings (FortiGate 2.4.5: neither HTTP
#   nor Telnet on any interface) is cited by the controls that check each
#   half; it holds only when all of them pass.
#
# Rejected on the rule, recorded so nobody re-adds them:
#   IOS-XE  EXT-006 (CIS 60 s, ours 120 s)  LOG-002 (CIS 1 host, ours 2)
#           EXT-018 (CIS requires informational; ours checks a level is set)
#           SNMP-002 (ours also forbids cisco/admin/default; CIS names two)
#           LOG-001 vs 2.2.1 (CIS means archive config-change logging)
#   ASA     EXT-006 / TIME-001 (CIS 5 min)  PWD-001 (CIS 14, ours 15)
#           AAA-001 / EXT-015 (CIS audits server groups for ssh specifically)
#           NTP-001 vs 1.9.1.3 (CIS requires a key)  SNMP-002 (as IOS-XE)
#   Junos   TIME-001 (CIS 15 min)  PWD-001 (CIS 10)  EXT-023/024 (CIS names
#           SHA1/AES128)  NTP-002 (CIS: a key on every server)
#   FortiOS PWD-001 (CIS 14)  HTTPS-001 (CIS TLS 1.3 only)  TIME-001 (CIS 5)
#           EXT-013 (CIS also bounds threshold and duration)
#   PAN-OS  PWD-001 (CIS 12)  HTTP-001/TEL-001 vs 1.2.4 (CIS audits interface
#           management profiles; our pack reads the device service setting)
#
# CIS publishes no SonicWall benchmark, so sonicwall_sonicos has no entry and
# selecting CIS on a SonicWall reports exactly that. The AWS benchmark's
# contents could not be read from the local copy, so nothing is mapped to it
# rather than mapped from memory.

